services:
  cnipa:
    build: .
    container_name: cnipa-collector
    ports:
      - "8765:8765"
    volumes:
      # data/ 目录整体挂载，包含 SQLite 数据库、坐标配置、采集日志
      - ./data:/app/data
    env_file:
      - .env          # CNIPA_USERNAME / CNIPA_PASSWORD 从此文件读取
    environment:
      DISPLAY: ":99"
      USE_VIRTUAL_DISPLAY: "true"
      XVFB_EXTERNAL: "true"
      USE_MITM_PROXY: "true"
      PYAUTOGUI_FAILSAFE: "false"
    restart: unless-stopped
    shm_size: 256m    # Chrome 在容器内需要更大的共享内存
