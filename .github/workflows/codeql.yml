name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:30 UTC 定期扫描（捕获新披露的规则）
    - cron: "30 3 * * 1"

jobs:
  analyze:
    name: 分析 Python 代码
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: 执行分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
