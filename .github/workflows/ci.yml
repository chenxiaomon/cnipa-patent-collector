name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新 push 自动取消旧的运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装系统依赖（xvfb 供 pyautogui 在无头环境 import）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 语法检查
        run: python -m compileall -q $(ls *.py)

      - name: 代码检查（ruff lint）
        run: ruff check .

      - name: 版本一致性校验（VERSION == pyproject.toml）
        run: python scripts/sync_version.py --check

      - name: 发布清单一致性校验
        run: |
          python scripts/generate_code_manifest.py
          git diff --exit-code -- release_manifest.json

      - name: 单元测试（排除依赖真实 DB 的数据质量测试）
        run: xvfb-run -a python -m pytest tests/ -q --ignore=tests/test_validation.py
