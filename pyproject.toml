[project]
name = "cnipa-patent-collector"
version = "2026.08.13"
description = "CNIPA 专利发文信息采集工具"
requires-python = ">=3.10"
dependencies = [
    "undetected-chromedriver>=3.5.3",
    "selenium>=4.0.0",
    "pyautogui>=0.9.53",
    "mitmproxy>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyvirtualdisplay>=3.0; sys_platform != 'win32'",
    "setuptools",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py310"
# 不启用行长检查（E501）：存量代码多长行，逐条改 churn 大、收益低
line-length = 200
exclude = ["cockpit-tools-main", ".venv", "venv", "data"]

[tool.ruff.lint]
# 只抓真问题：E4/E7/E9 语法与运行时错误 + F pyflakes（未用导入/变量/未定义名）
# 不做风格唠叨（命名、注释、import 排序等），避免大规模重排
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F541",  # f-string 缺占位符纯属美观（100 处），忽略不 churn
    "E402",  # 模块导入不在文件顶部：本项目普遍先 sys.path.insert 再 import 本地模块，是故意写法
]
