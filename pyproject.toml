[project]
name = "cnipa-patent-collector"
version = "0.1.0"
description = "CNIPA 专利发文信息采集工具"
requires-python = ">=3.10"
dependencies = [
    "undetected-chromedriver>=3.5.3",
    "selenium>=4.0.0",
    "pyautogui>=0.9.53",
    "mitmproxy>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyvirtualdisplay>=3.0",
    "setuptools",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
